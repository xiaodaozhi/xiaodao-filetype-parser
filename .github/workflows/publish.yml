name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npmjs.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm run release:check

      - name: Verify npm Trusted Publishing support
        shell: bash
        run: |
          npm_version="$(npm --version)"
          NPM_VERSION="$npm_version" node --input-type=module -e "const [major, minor, patch] = process.env.NPM_VERSION.split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) { console.error('npm 11.5.1 or newer is required for Trusted Publishing'); process.exit(1); } console.log('npm ' + process.env.NPM_VERSION + ' supports Trusted Publishing');"

      - run: npm ci
      - run: npm run check
      - run: npm run pack:check

      - name: Verify GitHub OIDC availability
        shell: bash
        run: |
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo '::error::GitHub OIDC is unavailable. The publish job requires id-token: write.'
            exit 1
          fi

      # npm obtains a short-lived publish credential from GitHub's OIDC token.
      # Do not configure registry-url or NODE_AUTH_TOKEN: setup-node's placeholder
      # credential can hide a failed OIDC exchange behind a registry E404.
      - name: Publish to npmjs.org with OIDC Trusted Publishing
        run: npm publish --access public
